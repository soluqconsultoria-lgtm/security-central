name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar projeto
        run: unzip -q "$(ls security-central*.zip | head -n 1)"
      - name: Garantir gradle.properties
        run: printf 'org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true\n' > security-central/gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar APK debug
        working-directory: security-central
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: security-central-apk
          path: security-central/app/build/outputs/apk/debug/*.apk
